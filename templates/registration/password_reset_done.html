{% extends "base.html" %}

{% block title %}Correo enviado{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-md-7">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h1 class="h4 mb-2">Revisa tu correo</h1>
        <p class="text-muted mb-4">
          Si el correo ingresado pertenece a una cuenta activa, recibiras un enlace para restablecer tu contrasena.
        </p>
        <a class="btn btn-primary" href="{% url 'login' %}">Volver al ingreso</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
